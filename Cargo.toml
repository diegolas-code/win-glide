[package]
name = "win-glide"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.14"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tiny-skia = "0.11.4"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }
